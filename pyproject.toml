[project]
name = "bizpilot-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "maroofiums", email = "maroofiums@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.162.7",
    "fastmcp>=4.2.0",
    "httpx>=0.28.1",
    "langchain>=1.5.0",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.8.0",
    "langchain-google-genai>=4.5.0",
    "langgraph>=1.2.22",
    "langsmith>=0.14.17",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "ruff>=0.17.5",
    "sentence-transformers>=6.3.0",
    "streamlit>=1.67.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
bizpilot-ai = "bizpilot_ai:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
